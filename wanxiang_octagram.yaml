## 定义万象语法模型
## 调用格式为 __include: [文件名]:/[文件内部的键名]
## 例如， __include: wanxiang_octagram:/octagram

octagram:
  grammar:
    language: wanxiang-lts-zh-hans # 从 https://github.com/amzxyz/RIME-LMDG/releases 下载，不需要后缀 .gram
    collocation_max_length: 8 #命中的最长词组
    collocation_min_length: 2 #命中的最短词组，搭配词频健全的词库时候应当最小值设为3避开2字高频词
    collocation_penalty: -10 #默认-12，对常见搭配词组施加的惩罚值。较高的负值会降低这些搭配被选中的概率，防止过于频繁地出现某些固定搭配。
    non_collocation_penalty: -5 #默认-12，对非搭配词组施加的惩罚值。较高的负值会降低非搭配词组被选中的概率，避免不合逻辑或不常见的词组组合。
    weak_collocation_penalty: -100 #默认-12，对弱搭配词组施加的惩罚值。保持默认值通常是为了有效过滤掉不太常见但仍然合理的词组组合。
    rear_penalty: -5 #默认-18，对词组中后续词语的位置施加的惩罚值。较高的负值会降低某些词语在句子后部出现的概率，防止句子结构不自然。  
  translator/contextual_suggestions: false #模型预测，假设模型里面有的四个字的词汇 现在智能 而首选组合 现在只能 当你输入 现在 上屏后下一次输入zhi neng就会输出，智能前提是没有权重更高的了，很明显这与你的预期“现在只能”不符。很明显实际上又要预测又要连续句子，放一起是很难优雅的。
  translator/max_homophones: 8
  translator/max_homographs: 8